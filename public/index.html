<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#315b4c" />
    <meta
      name="description"
      content="Rangkumin, aplikasi keuangan sederhana untuk pasangan."
    />
    <link rel="stylesheet" href="/styles.css" />
    <title>Rangkumin</title>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Keuangan berdua, lebih tertata</p>
      <h1>Rangkumin</h1>
      <p class="intro">
        Catat pemasukan, pengeluaran, dan tujuan tabungan bersama dalam satu
        tempat.
      </p>

      <section class="status-card" aria-labelledby="status-title">
        <div>
          <p class="status-label" id="status-title">Status layanan</p>
          <p class="status-value" data-health-status>Memeriksa...</p>
        </div>
        <span class="status-dot" data-health-dot aria-hidden="true"></span>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
