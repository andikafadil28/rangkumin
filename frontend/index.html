<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f0e9" />
    <meta
      name="description"
      content="Rangkumin, ruang keuangan sederhana untuk tumbuh bersama."
    />
    <script>
      (() => {
        const saved = localStorage.getItem("rangkumin-theme");
        document.documentElement.dataset.theme =
          saved === "calm" || saved === "minimal" ? saved : "together";
      })();
    </script>
    <title>Rangkumin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
